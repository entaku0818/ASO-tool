<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ASO Compass — macOS リデザイン（A. Aurora / B. Daylight）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
        "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f0eee9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Animations used across both variants */
    @keyframes asoFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes asoSheetIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Data (plain JS) -->
  <script src="src/data.js"></script>
  <script src="src/themes.js"></script>

  <!-- Starters & components (JSX) -->
  <script type="text/babel" src="src/starters/design-canvas.jsx"></script>
  <script type="text/babel" src="src/aso-shared.jsx"></script>
  <script type="text/babel" src="src/aso-app.jsx"></script>
  <script type="text/babel" src="src/aso-web-app.jsx"></script>

  <!-- Mount -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="aso-macos"
            title="macOS ネイティブ — 2案比較"
            subtitle="既存 SwiftUI 版のリデザイン（NavigationSplitView + 3タブ）"
          >
            <DCArtboard
              id="aurora"
              label="A. Aurora — Dark / Mint Aurora"
              width={1280}
              height={800}
            >
              <AsoApp theme={window.AURORA_THEME} />
            </DCArtboard>

            <DCArtboard
              id="daylight"
              label="B. Daylight — Light / Warm Coral"
              width={1280}
              height={800}
            >
              <AsoApp theme={window.DAYLIGHT_THEME} />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="aso-web"
            title="Web — 2案比較"
            subtitle="aso-tool.entaku.app（Next.js）の同モチーフ版。トップナビ＋アプリスイッチャー型"
          >
            <DCArtboard
              id="web-aurora"
              label="A. Aurora — Dark / Mint Aurora"
              width={1440}
              height={900}
            >
              <AsoWebApp theme={window.AURORA_THEME} />
            </DCArtboard>

            <DCArtboard
              id="web-daylight"
              label="B. Daylight — Light / Warm Coral"
              width={1440}
              height={900}
            >
              <AsoWebApp theme={window.DAYLIGHT_THEME} />
            </DCArtboard>
          </DCSection>

          <DCPostIt top={10} left={1330} rotate={-3} width={220}>
            両 macOS／Web ともに全てインタラクティブ：<br/>
            アプリ切替・タブ切替・キーワード選択→チャート更新・期間切替・ギャップ表のソート＆フィルタ・メタデータ言語切替＋文字数カウンタ・キーワード追加モーダル
          </DCPostIt>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
