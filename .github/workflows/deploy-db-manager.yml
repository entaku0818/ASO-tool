name: Deploy DB Manager

on:
  push:
    branches: [main]
    paths:
      - 'db-manager/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and Push Docker image
        working-directory: db-manager
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/db-manager:${{ github.sha }} \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/db-manager:latest \
            .
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/db-manager:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/db-manager:latest

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy db-manager \
            --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/db-manager:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=$PROJECT_ID" \
            --memory 128Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 10
