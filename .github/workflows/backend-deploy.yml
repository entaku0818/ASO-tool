name: Deploy Backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed (skip check for manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Start Cloud SQL before deploy
        run: |
          echo "Starting Cloud SQL instance..."
          curl -s -X GET "https://db-manager-te5er5txcq-an.a.run.app?action=start"
          echo "Waiting for DB to start (90 seconds)..."
          sleep 90
          echo "Checking DB status..."
          curl -s -X GET "https://db-manager-te5er5txcq-an.a.run.app?action=status"

      - name: Build and Push Docker image
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }} .
          docker build -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:latest .
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:latest

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Note: --add-cloudsql-instances omitted to avoid sqladmin API requirement.
          # Cloud SQL connection is already configured on the existing service.
          gcloud run deploy aso-api \
            --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},ASC_ENCRYPTION_KEY=${{ secrets.ASC_ENCRYPTION_KEY }},STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},STRIPE_PRICE_LICENSE=price_1TXIQ9Gv7DVBIWpT9gtxVE9Q,STRIPE_PRICE_MONTHLY=${{ secrets.STRIPE_PRICE_MONTHLY }},STRIPE_PRICE_YEARLY=${{ secrets.STRIPE_PRICE_YEARLY }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},FRONTEND_BASE_URL=https://aso-tool.entaku.app" \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --cpu-boost \
            --timeout 300
