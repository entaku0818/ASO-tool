name: Deploy Backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and Push Docker image
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }} .
          docker build -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:latest .
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:latest

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy aso-api \
            --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/api:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=$PROJECT_ID:asia-northeast1:aso-db \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80
