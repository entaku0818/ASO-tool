name: macOS CI

on:
  push:
    branches: [main]
    paths: ['macos/**']
  pull_request:
    branches: [main]
    paths: ['macos/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --reporter github-actions-logging

# NOTE: xcodebuild build / test は macOS ランナー (macos-latest) の課金が高いため CI から廃止。
# コミット前にローカルで実行すること。手順は README.md「macOS アプリのローカル検証」を参照。
