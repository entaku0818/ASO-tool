name: macOS CI

on:
  push:
    branches: [main]
    paths: ['macos/**']
  pull_request:
    branches: [main]
    paths: ['macos/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --reporter github-actions-logging
