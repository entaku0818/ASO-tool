name: macOS CI

on:
  push:
    branches: [main]
    paths: ['macos/**']
  pull_request:
    branches: [main]
    paths: ['macos/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --reporter github-actions-logging

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: macos/ASO-tool
        run: |
          xcodebuild build \
            -project ASO-tool.xcodeproj \
            -scheme ASO-tool \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: macos/ASO-tool
        run: |
          xcodebuild test \
            -project ASO-tool.xcodeproj \
            -scheme ASO-tool \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
