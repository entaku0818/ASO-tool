name: macOS CI

on:
  push:
    branches: [main]
    paths: ['macos/**']
  pull_request:
    branches: [main]
    paths: ['macos/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build
        working-directory: macos/ASO-tool
        run: |
          xcodebuild -project ASO-tool.xcodeproj -scheme ASO-tool \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        working-directory: macos/ASO-tool
        run: |
          xcodebuild -project ASO-tool.xcodeproj -scheme ASO-tool \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
