name: Batch Scheduler

on:
  schedule:
    # Run daily at 9:00 JST (0:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - all
          - rankings
          - reviews

env:
  API_URL: https://aso-api-671942133800.asia-northeast1.run.app

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'rankings'

    steps:
      - name: Trigger rankings update
        run: |
          echo "Triggering rankings update..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_URL }}/api/scraper/trigger")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" -ge 400 ]; then
            echo "Error: API returned $http_code"
            exit 1
          fi

  fetch-reviews:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'reviews'
    needs: update-rankings

    steps:
      - name: Get all apps and fetch reviews
        run: |
          echo "Fetching apps..."
          apps=$(curl -s "${{ env.API_URL }}/api/apps")
          echo "Apps: $apps"

          # Parse app IDs and fetch reviews for each
          echo "$apps" | jq -r '.[].id' | while read app_id; do
            if [ -n "$app_id" ]; then
              echo "Fetching reviews for app: $app_id"
              curl -s -X POST "${{ env.API_URL }}/api/apps/$app_id/scrape/reviews"
            fi
          done

  notify-complete:
    runs-on: ubuntu-latest
    needs: [update-rankings, fetch-reviews]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Batch Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rankings update: ${{ needs.update-rankings.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reviews fetch: ${{ needs.fetch-reviews.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Completed at: $(date)" >> $GITHUB_STEP_SUMMARY
