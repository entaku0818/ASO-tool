name: Batch Scheduler

on:
  schedule:
    # Run daily at 9:00 JST (0:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - all
          - rankings
          - tracked-keywords
          - migrate
          - seed

jobs:
  run-batch:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and Push batch image
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build -f Dockerfile.batch \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:latest \
            .
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:latest

      - name: Create or update Cloud Run Job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Check if job exists
          if gcloud run jobs describe aso-batch --region asia-northeast1 --project $PROJECT_ID 2>/dev/null; then
            echo "Updating existing job..."
            gcloud run jobs update aso-batch \
              --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
              --region asia-northeast1 \
              --set-cloudsql-instances=$PROJECT_ID:asia-northeast1:aso-db \
              --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" \
              --memory 512Mi \
              --cpu 1 \
              --task-timeout 30m \
              --max-retries 1
          else
            echo "Creating new job..."
            gcloud run jobs create aso-batch \
              --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
              --region asia-northeast1 \
              --set-cloudsql-instances=$PROJECT_ID:asia-northeast1:aso-db \
              --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" \
              --memory 512Mi \
              --cpu 1 \
              --task-timeout 30m \
              --max-retries 1
          fi

      - name: Execute batch job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JOB_TYPE: ${{ github.event.inputs.job || 'all' }}
        run: |
          echo "Running batch job: $JOB_TYPE"
          gcloud run jobs execute aso-batch \
            --region asia-northeast1 \
            --args "$JOB_TYPE" \
            --wait

      - name: Summary
        if: always()
        run: |
          echo "## Batch Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Job type: ${{ github.event.inputs.job || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Completed at: $(date)" >> $GITHUB_STEP_SUMMARY
