services:
  db:
    image: postgres:16-alpine
    container_name: aso-db
    environment:
      POSTGRES_USER: aso
      POSTGRES_PASSWORD: aso_password
      POSTGRES_DB: aso_tool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aso -d aso_tool"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aso-api
    environment:
      DATABASE_URL: postgres://aso:aso_password@db:5432/aso_tool?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
